[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every page. The Content Security Policy for scripts and
# styles is a <meta> tag that Astro writes into each page (see astro.config.mjs);
# frame-ancestors only works as a real header, so it's set here.
[[headers]]
  for = "/*"
  [headers.values]
    # Don't let other sites show this one inside a frame (clickjacking).
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    # Always use HTTPS.
    Strict-Transport-Security = "max-age=31536000"
    # Browsers must trust the file types the server sends.
    X-Content-Type-Options = "nosniff"
    # Other sites only see the domain a visitor came from, not the full URL.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The site never needs the camera, microphone, location or payment APIs.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Astro's built files have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
